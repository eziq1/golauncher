name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.ref_name }}
      # Optional update signing (docs/auto-update.md §9): the public key, a
      # repository variable, is built into the programs, which then require
      # checksums.txt.sig; the private key is a secret.
      GOLAUNCHER_UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Version
        id: version
        run: |
          if ($env:TAG -notmatch '^v(\d+)\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "tag $env:TAG is not a version (vMAJOR.MINOR.PATCH[-PRE])"
          }
          $version = $env:TAG.Substring(1)
          # Only versions with a pre-release suffix (v1.2.0-rc.1) are marked
          # pre-release. v0.x releases are regular ones: GitHub never shows a
          # pre-release as "Latest" (repo sidebar, /releases/latest).
          $prerelease = $Matches[2] ? 'true' : 'false'
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Output "version $version, prerelease $prerelease"

      - name: Release notes from CHANGELOG.md
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $notes = ./scripts/changelog.ps1 -Version '${{ steps.version.outputs.version }}'
          Set-Content -Path dist/notes.md -Value $notes -Encoding utf8NoBOM
          Get-Content dist/notes.md

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/... ./plugins/...

      - name: Build and package
        run: |
          # amd64 last, so that dist/*.exe are the runner's for the smoke test.
          foreach ($arch in 'arm64', 'amd64') {
            ./scripts/build.ps1 -Arch $arch -Version '${{ steps.version.outputs.version }}' -Zip
          }

      - name: Smoke test (amd64)
        run: |
          $v = ./dist/glctl.exe version --format text
          if ($v -ne '${{ steps.version.outputs.version }}') { throw "glctl version = $v" }
          ./dist/glctl.exe i18n check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = (Get-Item ./dist/golauncher.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileVersion, LegalCopyright
          if ($info.ProductVersion -ne '${{ steps.version.outputs.version }}') { throw "golauncher.exe ProductVersion = $($info.ProductVersion)" }

      - name: Checksums
        run: |
          $lines = Get-ChildItem dist -Filter *.zip | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [System.IO.File]::WriteAllText("$PWD/dist/checksums.txt", ($lines -join "`n") + "`n")
          Get-Content dist/checksums.txt

      - name: Sign checksums
        if: env.GOLAUNCHER_UPDATE_PUBLIC_KEY != ''
        env:
          GOLAUNCHER_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # The programs require a signature now: never publish without one.
          if (-not $env:GOLAUNCHER_UPDATE_SIGNING_KEY) { throw 'vars.UPDATE_PUBLIC_KEY is set but secrets.UPDATE_SIGNING_KEY is not' }
          ./dist/glctl.exe update sign dist/checksums.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # With the key built into glctl: the key pair matches.
          ./dist/glctl.exe update verify dist/checksums.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -Filter *.zip | ForEach-Object FullName) + "dist/checksums.txt"
          if (Test-Path dist/checksums.txt.sig) { $assets += "dist/checksums.txt.sig" }
          $flags = @()
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $env:TAG --title "golauncher $env:TAG" --notes-file dist/notes.md --verify-tag @flags @assets
