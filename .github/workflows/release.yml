name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    # golauncher.app for Apple Silicon (arm64) and Intel (amd64), one zip
    # each (docs/self-install.md §9), ad hoc signed: no Developer ID signing
    # or notarization yet.
    name: Build (macos)
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
      GOLAUNCHER_UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Version
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG is not a version (vMAJOR.MINOR.PATCH[-PRE])" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build, package and smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          host="$(go env GOHOSTARCH)"
          for arch in arm64 amd64; do
            out="dist/$arch"
            scripts/macos/build.sh --arch "$arch" --app --zip --version "$VERSION" --out-dir "$out"
            app="$out/golauncher.app"
            plutil -lint "$app/Contents/Info.plist"
            got="$(plutil -extract GolauncherVersion raw "$app/Contents/Info.plist")"
            [ "$got" = "$VERSION" ] || { echo "$arch: Info.plist version = $got" >&2; exit 1; }
            codesign --verify --strict --deep --verbose=2 "$app"
            codesign -dv "$app"
            [ "$(lipo -archs "$app/Contents/MacOS/golauncher")" = "$([ "$arch" = amd64 ] && echo x86_64 || echo arm64)" ]
            if [ "$arch" = "$host" ]; then
              v="$("$app/Contents/MacOS/glctl" version --format text)"
              [ "$v" = "$VERSION" ] || { echo "$arch: glctl version = $v" >&2; exit 1; }
              "$app/Contents/MacOS/glctl" i18n check
            fi
            zip="$out/golauncher_${VERSION}_darwin_$arch.zip"
            unzip -Z1 "$zip" > "$RUNNER_TEMP/zip.txt"
            grep -qx 'golauncher.app/Contents/MacOS/golauncher' "$RUNNER_TEMP/zip.txt"
            mv "$zip" dist/
          done
          ls -l dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/golauncher_*_darwin_*.zip
          if-no-files-found: error

  release:
    name: Build and publish
    needs: macos
    runs-on: windows-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      cask: ${{ steps.cask.outcome }}
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.ref_name }}
      # Optional update signing (docs/auto-update.md §9): the public key, a
      # repository variable, is built into the programs, which then require
      # checksums.txt.sig; the private key is a secret.
      GOLAUNCHER_UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Version
        id: version
        run: |
          if ($env:TAG -notmatch '^v(\d+)\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "tag $env:TAG is not a version (vMAJOR.MINOR.PATCH[-PRE])"
          }
          $version = $env:TAG.Substring(1)
          # Only versions with a pre-release suffix (v1.2.0-rc.1) are marked
          # pre-release. v0.x releases are regular ones: GitHub never shows a
          # pre-release as "Latest" (repo sidebar, /releases/latest).
          $prerelease = $Matches[2] ? 'true' : 'false'
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Output "version $version, prerelease $prerelease"

      - name: Release notes from CHANGELOG.md
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $notes = ./scripts/release/changelog.ps1 -Version '${{ steps.version.outputs.version }}'
          Set-Content -Path dist/notes.md -Value $notes -Encoding utf8NoBOM
          Get-Content dist/notes.md

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/... ./plugins/...

      - name: Build and package
        run: |
          # amd64 last, so that dist/*.exe are the runner's for the smoke test.
          foreach ($arch in 'arm64', 'amd64') {
            ./scripts/windows/build.ps1 -Arch $arch -Version '${{ steps.version.outputs.version }}' -Zip
          }

      - name: Smoke test (amd64)
        run: |
          $v = ./dist/glctl.exe version --format text
          if ($v -ne '${{ steps.version.outputs.version }}') { throw "glctl version = $v" }
          ./dist/glctl.exe i18n check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = (Get-Item ./dist/golauncher.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileVersion, LegalCopyright
          if ($info.ProductVersion -ne '${{ steps.version.outputs.version }}') { throw "golauncher.exe ProductVersion = $($info.ProductVersion)" }

      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist

      - name: Checksums
        run: |
          # The Windows zips and the macOS one; auto-update finds each by name.
          $lines = Get-ChildItem dist -Filter *.zip | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [System.IO.File]::WriteAllText("$PWD/dist/checksums.txt", ($lines -join "`n") + "`n")
          Get-Content dist/checksums.txt

      - name: winget manifests
        # The manifests of this release for microsoft/winget-pkgs
        # (docs/winget-packaging.md), kept as a build artifact. Nothing is
        # submitted; a failure here never holds the release back.
        id: winget
        if: steps.version.outputs.prerelease == 'false'
        continue-on-error: true
        run: |
          go run ./scripts/release/wingetmanifest -version '${{ steps.version.outputs.version }}' -dist dist -out dist/winget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = (Get-ChildItem dist/winget -Recurse -Filter *.installer.yaml).DirectoryName
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest $dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output 'winget is not installed on this runner: the manifests were not validated'
          }

      - uses: actions/upload-artifact@v4
        if: steps.winget.outcome == 'success'
        continue-on-error: true
        with:
          name: winget-manifests
          path: dist/winget
          if-no-files-found: error

      - name: Homebrew cask
        # Casks/golauncher.rb of this release for the tap eziq1/homebrew-tap
        # (docs/homebrew-packaging.md), kept as a build artifact; the
        # homebrew job checks it and pushes it only when the
        # HOMEBREW_TAP_DEPLOY_KEY or HOMEBREW_TAP_TOKEN secret is set.
        # Never holds the release back.
        id: cask
        if: steps.version.outputs.prerelease == 'false'
        continue-on-error: true
        run: |
          go run ./scripts/release/brewcask -version '${{ steps.version.outputs.version }}' -dist dist -out dist/homebrew/Casks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content dist/homebrew/Casks/golauncher.rb

      - uses: actions/upload-artifact@v4
        if: steps.cask.outcome == 'success'
        continue-on-error: true
        with:
          name: homebrew-cask
          path: dist/homebrew/Casks/golauncher.rb
          if-no-files-found: error

      - name: Sign checksums
        if: env.GOLAUNCHER_UPDATE_PUBLIC_KEY != ''
        env:
          GOLAUNCHER_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # The programs require a signature now: never publish without one.
          if (-not $env:GOLAUNCHER_UPDATE_SIGNING_KEY) { throw 'vars.UPDATE_PUBLIC_KEY is set but secrets.UPDATE_SIGNING_KEY is not' }
          ./dist/glctl.exe update sign dist/checksums.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # With the key built into glctl: the key pair matches.
          ./dist/glctl.exe update verify dist/checksums.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -Filter *.zip | ForEach-Object FullName) + "dist/checksums.txt"
          if (Test-Path dist/checksums.txt.sig) { $assets += "dist/checksums.txt.sig" }
          $flags = @()
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $env:TAG --title "golauncher $env:TAG" --notes-file dist/notes.md --verify-tag @flags @assets

  homebrew:
    # The cask built by the release job (docs/homebrew-packaging.md §5):
    # brew style and brew audit in a throwaway local tap, then, only when
    # the repository secret HOMEBREW_TAP_DEPLOY_KEY (an SSH deploy key with
    # write access to eziq1/homebrew-tap only) or HOMEBREW_TAP_TOKEN is
    # set, a commit to eziq1/homebrew-tap. The release is already
    # published: nothing here can hold it back.
    name: Homebrew cask
    needs: release
    if: needs.release.outputs.prerelease == 'false' && needs.release.outputs.cask == 'success'
    runs-on: macos-latest
    continue-on-error: true
    env:
      TAG: ${{ github.ref_name }}
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-cask
          path: cask

      - name: brew style and brew audit
        continue-on-error: true
        env:
          # brew audit --online calls the GitHub API; anonymous calls from a
          # shared runner IP hit the rate limit (v0.10.0).
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew tap-new --no-git golauncher-ci/local
          tap="$(brew --repository golauncher-ci/local)"
          mkdir -p "$tap/Casks"
          cp cask/golauncher.rb "$tap/Casks/"
          brew style --cask golauncher-ci/local/golauncher
          brew audit --cask --online golauncher-ci/local/golauncher

      - name: Push to eziq1/homebrew-tap
        if: env.HOMEBREW_TAP_DEPLOY_KEY != '' || env.HOMEBREW_TAP_TOKEN != ''
        run: |
          set -euo pipefail
          if [ -n "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            key="$RUNNER_TEMP/tap_deploy_key"
            printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key"
            chmod 600 "$key"
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git clone --depth 1 git@github.com:eziq1/homebrew-tap.git tap
          else
            git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/eziq1/homebrew-tap.git" tap
          fi
          mkdir -p tap/Casks
          cp cask/golauncher.rb tap/Casks/golauncher.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "the tap already has this cask"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/golauncher.rb
          git commit -m "golauncher ${TAG#v}"
          git push origin HEAD